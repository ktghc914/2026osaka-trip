<footer>大阪自由行手冊・僅供個人行程規劃使用</footer>

<button class="back-to-top" id="backToTop" aria-label="回到頂部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="lightbox" id="lightbox" onclick="if(event.target === this) closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">← 返回優惠券頁面</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  // mobile menu toggle
  const toggle = document.getElementById('menuToggle');
  const menu = document.getElementById('mainMenu');
  toggle.addEventListener('click', () => menu.classList.toggle('open'));
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => menu.classList.remove('open')));

  // active link highlight on scroll
  const sections = document.querySelectorAll('section.page');
  const links = menu.querySelectorAll('a');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.getAttribute('id');
        links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  sections.forEach(s => observer.observe(s));

  // back-to-top visibility
  const backToTop = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('show', window.scrollY > 300);
  });

  // coupon lightbox
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightbox.classList.add('open');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }
</script>

</body>
